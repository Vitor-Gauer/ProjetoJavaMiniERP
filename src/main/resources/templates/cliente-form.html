<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Cliente - ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="card shadow border-0">
        <div class="card-header bg-dark text-white p-3">
            <h5 class="mb-0">📝 Novo Cliente</h5>
        </div>
        <div class="card-body p-4">
            <form th:action="@{/clientes/salvar}" method="post">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Nome Completo</label>
                        <input type="text" name="nome" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">E-mail</label>
                        <input type="email" name="email" class="form-control">
                    </div>

                    <div class="col-12"><hr></div>

                    <div class="col-md-3">
                        <label class="form-label fw-bold text-primary">CEP</label>
                        <input type="text" id="cep" name="cep" class="form-control border-primary" 
                               onblur="buscarCep(this.value)" placeholder="00000-000">
                    </div>
                    <div class="col-md-9">
                        <label class="form-label fw-bold">Logradouro</label>
                        <input type="text" id="logradouro" name="logradouro" class="form-control bg-white" readonly>
                    </div>

                    <div class="col-md-5">
                        <label class="form-label fw-bold">Bairro</label>
                        <input type="text" id="bairro" name="bairro" class="form-control bg-white" readonly>
                    </div>
                    <div class="col-md-5">
                        <label class="form-label fw-bold">Cidade</label>
                        <input type="text" id="localidade" name="localidade" class="form-control bg-white" readonly>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label fw-bold">UF</label>
                        <input type="text" id="uf" name="uf" class="form-control bg-white" readonly>
                    </div>

                    <div class="col-12 mt-4 d-flex gap-2">
                        <button type="submit" class="btn btn-success px-4 fw-bold">Salvar Cliente</button>
                        <a th:href="@{/painel}" class="btn btn-outline-secondary px-4">Cancelar</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    function buscarCep(valor) {
        const cep = valor.replace(/\D/g, '');
        if (cep.length === 8) {
            document.querySelectorAll('#logradouro, #bairro, #localidade, #uf').forEach(i => i.value = '...');
            
            fetch(`https://viacep.com.br/ws/${cep}/json/`)
                .then(res => res.json())
                .then(dados => {
                    if (!("erro" in dados)) {
                        document.getElementById('logradouro').value = dados.logradouro;
                        document.getElementById('bairro').value = dados.bairro;
                        document.getElementById('localidade').value = dados.localidade;
                        document.getElementById('uf').value = dados.uf;
                    } else {
                        alert("CEP não encontrado.");
                    }
                })
                .catch(() => alert("Erro ao buscar CEP."));
        }
    }
</script>
</body>
</html>
