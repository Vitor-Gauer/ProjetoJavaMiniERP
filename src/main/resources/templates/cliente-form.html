<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Cliente - ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        .loading-spinner {
            display: none;
            margin-left: 10px;
        }
        .cep-success {
            border-color: #198754 !important;
        }
        .cep-error {
            border-color: #dc3545 !important;
        }
    </style>
</head>
<body class="bg-light">
<div class="container py-4">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="p-2 bg-secondary text-white rounded text-center" style="width: 120px;">
            Logo<br><small>(Empresa)</small>
        </div>
        <h2 class="h3">Cadastro de Cliente</h2>
        <form th:action="@{/logout}" method="post" class="m-0">
            <button type="submit" class="btn btn-danger" title="Salva automaticamente ao sair">Sair</button>
        </form>
    </div>

    <!-- Formulário -->
    <div class="card shadow-sm">
        <div class="card-header">
            <h5 class="mb-0">
                <i class="bi bi-person-plus me-2"></i>Dados do Cliente
            </h5>
        </div>
        <div class="card-body">
            <form th:action="@{/clientes/salvar}" th:object="${cliente}" method="post">
                <input type="hidden" th:field="*{idLocalEmpresa}">
                
                <div class="row g-3">
                    <!-- Nome -->
                    <div class="col-md-6">
                        <label for="nome" class="form-label">Nome do Cliente</label>
                        <input type="text" class="form-control" th:field="*{nome}" id="nome" required>
                    </div>
                    
                    <!-- Telefone -->
                    <div class="col-md-6">
                        <label for="telefone" class="form-label">Telefone</label>
                        <input type="text" class="form-control" th:field="*{telefone}" id="telefone"
                               placeholder="(00) 00000-0000">
                    </div>
                    
                    <!-- CEP -->
                    <div class="col-md-4">
                        <label for="cepInput" class="form-label">CEP</label>
                        <div class="input-group">
                            <input type="text" class="form-control" th:field="*{cep}" 
                                   id="cepInput" maxlength="9" placeholder="00000-000"
                                   onblur="buscarEndereco()">
                            <span class="input-group-text">
                                <i class="bi bi-geo-alt"></i>
                            </span>
                            <div class="spinner-border spinner-border-sm loading-spinner" id="cepLoading"></div>
                        </div>
                        <div class="form-text">Digite o CEP e saia do campo para buscar o endereço</div>
                        <div class="invalid-feedback" id="cepError"></div>
                    </div>
                    
                    <!-- Rua -->
                    <div class="col-md-6">
                        <label for="ruaInput" class="form-label">Rua/Logradouro</label>
                        <input type="text" class="form-control" th:field="*{rua}" id="ruaInput" required>
                    </div>
                    
                    <!-- Número -->
                    <div class="col-md-2">
                        <label for="numeroInput" class="form-label">Número</label>
                        <input type="text" class="form-control" th:field="*{numero}" id="numeroInput" required>
                    </div>
                    
                    <!-- Saldo Inicial -->
                    <div class="col-md-4">
                        <label for="saldo" class="form-label">Saldo Inicial</label>
                        <div class="input-group">
                            <span class="input-group-text">R$</span>
                            <input type="number" class="form-control" th:field="*{saldo}" 
                                   step="0.01" min="0" value="0.00">
                        </div>
                    </div>
                    
                    <!-- Complemento -->
                    <div class="col-md-8">
                        <label for="complementoInput" class="form-label">Complemento</label>
                        <input type="text" class="form-control" id="complementoInput" th:field="*{complemento}"
                               placeholder="Apartamento, casa, etc.">
                    </div>
                    
                    <!-- Bairro (preenchido automaticamente) -->
                    <div class="col-md-4">
                        <label for="bairroInput" class="form-label">Bairro</label>
                        <input type="text" class="form-control" id="bairroInput" readonly>
                    </div>
                    
                    <!-- Cidade (preenchido automaticamente) -->
                    <div class="col-md-4">
                        <label for="cidadeInput" class="form-label">Cidade</label>
                        <input type="text" class="form-control" id="cidadeInput" readonly>
                    </div>
                    
                    <!-- Estado (preenchido automaticamente) -->
                    <div class="col-md-4">
                        <label for="estadoInput" class="form-label">Estado</label>
                        <input type="text" class="form-control" id="estadoInput" readonly>
                    </div>
                </div>
                
                <!-- Endereço formatado (campo oculto para o backend) -->
                <input type="hidden" th:field="*{endereco}" id="enderecoCompleto">
                
                <hr>
                
                <!-- Botões -->
                <div class="d-flex justify-content-between">
                    <a href="/tabelas" class="btn btn-secondary">
                        <i class="bi bi-arrow-left me-1"></i> Voltar
                    </a>
                    <div>
                        <button type="button" class="btn btn-outline-danger me-2" onclick="limparFormulario()">
                            <i class="bi bi-x-circle me-1"></i> Limpar
                        </button>
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-check-circle me-1"></i> Salvar Cliente
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
function buscarEndereco() {
    const cepInput = document.getElementById('cepInput');
    const cepValue = cepInput.value.replace(/\D/g, ''); // Remove caracteres não numéricos
    
    // Resetar estados
    cepInput.classList.remove('cep-success', 'cep-error');
    document.getElementById('cepError').textContent = '';
    document.getElementById('cepLoading').style.display = 'inline-block';
    
    // Validar CEP
    if (cepValue.length !== 8) {
        mostrarErroCEP('CEP deve conter 8 dígitos');
        return;
    }
    
    // Chamar API ViaCEP diretamente (frontend)
    fetch(`https://viacep.com.br/ws/${cepValue}/json/`)
        .then(response => {
            if (!response.ok) {
                throw new Error('Erro na consulta do CEP');
            }
            return response.json();
        })
        .then(data => {
            if (data.erro) {
                throw new Error('CEP não encontrado');
            }
            
            // Preencher campos
            document.getElementById('ruaInput').value = data.logradouro || '';
            document.getElementById('bairroInput').value = data.bairro || '';
            document.getElementById('cidadeInput').value = data.localidade || '';
            document.getElementById('estadoInput').value = data.uf || '';
            
            // Indicar sucesso
            cepInput.classList.add('cep-success');
            
            // Focar no campo número
            document.getElementById('numeroInput').focus();
            
            // Atualizar endereço completo
            atualizarEnderecoCompleto();
        })
        .catch(error => {
            mostrarErroCEP(error.message);
        })
        .finally(() => {
            document.getElementById('cepLoading').style.display = 'none';
        });
}

function mostrarErroCEP(mensagem) {
    const cepInput = document.getElementById('cepInput');
    const cepError = document.getElementById('cepError');
    
    cepInput.classList.add('cep-error');
    cepError.textContent = mensagem;
    document.getElementById('cepLoading').style.display = 'none';
}

function atualizarEnderecoCompleto() {
    const cep = document.getElementById('cepInput').value;
    const rua = document.getElementById('ruaInput').value;
    const numero = document.getElementById('numeroInput').value;
    const complemento = document.getElementById('complementoInput').value;
    
    // Formatar: cep,rua,numero[,complemento]
    let endereco = `${cep},${rua},${numero}`;
    if (complemento.trim()) {
        endereco += `,${complemento}`;
    }
    
    document.getElementById('enderecoCompleto').value = endereco;
}

function limparFormulario() {
    if (confirm('Tem certeza que deseja limpar todos os campos?')) {
        document.querySelector('form').reset();
        document.getElementById('cepInput').classList.remove('cep-success', 'cep-error');
        document.getElementById('cepError').textContent = '';
        document.getElementById('bairroInput').value = '';
        document.getElementById('cidadeInput').value = '';
        document.getElementById('estadoInput').value = '';
        document.getElementById('enderecoCompleto').value = '';
    }
}

// Formatar CEP enquanto digita
document.getElementById('cepInput').addEventListener('input', function(e) {
    let value = e.target.value.replace(/\D/g, '');
    if (value.length > 5) {
        value = value.substring(0, 5) + '-' + value.substring(5, 8);
    }
    e.target.value = value;
});

// Atualizar endereço quando os campos mudarem
['ruaInput', 'numeroInput', 'complementoInput'].forEach(id => {
    document.getElementById(id).addEventListener('change', atualizarEnderecoCompleto);
});

// Formatar telefone
document.querySelector('input[name="telefone"]').addEventListener('input', function(e) {
    let value = e.target.value.replace(/\D/g, '');
    if (value.length > 0) {
        value = '(' + value.substring(0, 2);
        if (value.length > 2) {
            value += ') ' + value.substring(2, 7);
        }
        if (value.length > 9) {
            value += '-' + value.substring(7, 11);
        }
    }
    e.target.value = value;
});
</script>
</body>
</html>
