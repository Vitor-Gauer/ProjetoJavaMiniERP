<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Principal - ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<header class="p-3 bg-dark text-white text-center d-flex justify-content-between align-items-center">
    <div class="border p-2 rounded">Logo Nosso</div>
    <h1 class="h4 m-0">Página Principal</h1>
    <div style="width: 100px;"></div> </header>

<main class="container flex-grow-1 d-flex flex-column justify-content-center align-items-center my-5">
    <div class="row g-3 justify-content-center max-w-75">
        <div class="col-auto"><button class="btn btn-primary btn-lg px-4">Produtos</button></div>
        <div class="col-auto"><button class="btn btn-primary btn-lg px-4">Fornecedores</button></div>
        <div class="col-auto"><button class="btn btn-primary btn-lg px-4">Clientes</button></div>
        <div class="col-auto"><button class="btn btn-primary btn-lg px-4">Estoques</button></div>
        <div class="col-auto"><button class="btn btn-primary btn-lg px-4">Tesouros</button></div>
        <div class="col-auto"><button class="btn btn-primary btn-lg px-4">Usuários</button></div>
    </div>
    <br>
    <div class="row g-3 justify-content-center max-w-75">
        <div class="col-auto"><button class="btn btn-secondary btn-lg px-4">Vendas</button></div>
        <div class="col-auto"><button class="btn btn-secondary btn-lg px-4">Compras</button></div>
        <div class="col-auto"><button class="btn btn-warning btn-lg px-4">Movimentações</button></div>
        <div class="col-auto"><button class="btn btn-dark btn-lg px-4">Auditoria</button></div>
    </div>

    <div class="mt-5 p-5 bg-secondary text-white rounded text-center" style="width: 800px; height: 400px;">
        <p>Logo (da empresa que esta usando)</p>
    </div>
</main>

<footer class="p-3 bg-white border-top d-flex justify-content-between align-items-center">
    <button class="btn btn-link text-decoration-none text-dark">Acessibilidade</button>
    <button class="btn btn-danger">Sair</button>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
