<div th:fragment="modalNavegacao" id="modalLinks" class="modal-erp" onclick="if(event.target==this) fecharModal()">
    <style>
        .modal-erp {
            display: none; position: fixed; z-index: 1050; left: 0; top: 0; 
            width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
        }
        .card-modulo {
            transition: all 0.3s ease; cursor: pointer; text-decoration: none; border: 2px solid transparent;
        }
        .card-modulo:hover {
            transform: translateY(-5px); border-color: #0d6efd; background-color: #f8f9fa;
        }
    </style>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8 bg-white rounded shadow p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3 class="m-0 text-secondary">Navegação do Sistema</h3>
                    <button type="button" class="btn-close" onclick="fecharModal()"></button>
                </div>
                
                <div class="row g-3">
                    <div class="col-md-6">
                        <a th:href="@{/clientes}" class="card card-modulo p-4 text-center">
                            <h2 class="mb-1">👥</h2>
                            <h5 class="text-dark m-0">Clientes</h5>
                        </a>
                    </div>
                    <div class="col-md-6">
                        <a th:href="@{/produtos}" class="card card-modulo p-4 text-center">
                            <h2 class="mb-1">📦</h2>
                            <h5 class="text-dark m-0">Produtos</h5>
                        </a>
                    </div>
                    <div class="col-md-6">
                        <a th:href="@{/fornecedores}" class="card card-modulo p-4 text-center">
                            <h2 class="mb-1">🏢</h2>
                            <h5 class="text-dark m-0">Fornecedores</h5>
                        </a>
                    </div>
                    <div class="col-md-6">
                        <a th:href="@{/movimentacoes}" class="card card-modulo p-4 text-center">
                            <h2 class="mb-1">💸</h2>
                            <h5 class="text-dark m-0">Movimentações</h5>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        function abrirModal() { document.getElementById('modalLinks').style.display = 'block'; }
        function fecharModal() { document.getElementById('modalLinks').style.display = 'none'; }
    </script>
</div>
