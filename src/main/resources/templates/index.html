<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dono do Negócio</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; background: #f4f7f6; }
        .hero { background: #fff; padding: 40px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 600px; margin: auto; }
        .btn-login { display: inline-block; background: #2c3e50; color: white; padding: 12px 24px; text-decoration: none; border-radius: 5px; margin-top: 20px; font-weight: bold; }
        .btn-login:hover { background: #1a252f; }
    </style>
</head>
<body>
    <div class="hero">
        <h1>Bem-vindo ao Dono do Negócio</h1>
        <p>O seu sistema completo de gestão de Clientes, Produtos, Fornecedores e Movimentações.</p>
        <a th:href="@{/login}" class="btn-login">Fazer Login</a>
    </div>
</body>
</html>
