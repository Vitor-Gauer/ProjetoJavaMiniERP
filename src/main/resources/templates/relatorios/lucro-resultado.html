<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório de Lucro - ERP</title>
</head>
<body>
    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-dark">
                <tr>
                    <th id="header-produto">Produto</th>
                    <th id="header-qtd-vendas" class="text-center">Qtd. Vendas</th>
                    <th id="header-qtd-compras" class="text-center">Qtd. Compras</th>
                    <th id="header-lucro-atual" class="text-end">Lucro Atual</th>
                    <th id="header-lucro-passado" class="text-end">Lucro Passado</th>
                    <th id="header-crescimento" class="text-center">Crescimento %</th>
                    <th id="header-liquidez" class="text-center">Liquidez</th>
                    <th id="header-analise" scope="col">Análise Mensal</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="item : ${relatorio}">
                    <td th:text="${item.produtoNome}">Produto 1</td>
                    <td class="text-center" th:text="${item.quantidadeVendas}">100</td>
                    <td class="text-center" th:text="${item.quantidadeCompras}">50</td>
                    <td class="text-end" th:text="${#numbers.formatCurrency(item.lucroAtual)}">R$ 5.000,00</td>
                    <td class="text-end" th:text="${#numbers.formatCurrency(item.lucroPassado)}">R$ 3.000,00</td>
                    <td class="text-center">
                        <span th:class="${item.crescimentoAnual != null and item.crescimentoAnual > 0} ? 'text-success fw-bold' :
                                       ${item.crescimentoAnual != null and item.crescimentoAnual < 0} ? 'text-danger fw-bold' : 'text-muted'"
                              th:text="${#numbers.formatPercent(item.crescimentoAnual / 100, 2, 2)}">+66.67%</span>
                    </td>
                    <td class="text-center">
                        <span th:if="${item.quantidadeVendas > 0}"
                              th:text="${#numbers.formatDecimal(item.quantidadeCompras / item.quantidadeVendas, 1, 1)}">0.5</span>
                        <span th:unless="${item.quantidadeVendas > 0}">N/A</span>
                    </td>
                    <td>
                        <small class="text-muted" th:if="${item.lucroMensal != null and not #lists.isEmpty(item.lucroMensal)}">
                            <div th:each="mes : ${item.lucroMensal}" class="mb-1">
                                <strong th:text="${mes.mes}">JANEIRO</strong>:
                                <span th:class="${mes.lucro != null and mes.lucro > 0} ? 'text-success' :
                                               ${mes.lucro != null and mes.lucro < 0} ? 'text-danger' : 'text-muted'"
                                      th:text="${#numbers.formatCurrency(mes.lucro)}">R$ 500,00</span>
                                <span th:if="${mes.crescimento != null}"
                                      th:class="${mes.crescimento > 0} ? 'text-success' :
                                             ${mes.crescimento < 0} ? 'text-danger' : 'text-muted'"
                                      th:text="'(' + ${#numbers.formatPercent(mes.crescimento / 100, 1, 1)} + ')'">(+10.0%)</span>
                            </div>
                        </small>
                        <span th:unless="${item.lucroMensal != null and not #lists.isEmpty(item.lucroMensal)}" class="text-muted">N/A</span>
                    </td>
                </tr>
            </tbody>
            <tfoot class="table-secondary">
                <tr>
                    <th id="footer-totais" scope="row">Totais</th>
                    <th scope="col" class="text-center" th:text="${#lists.size(relatorio) > 0 ? #aggregates.sum(relatorio.![quantidadeVendas]) : 0}">0</th>
                    <th scope="col" class="text-center" th:text="${#lists.size(relatorio) > 0 ? #aggregates.sum(relatorio.![quantidadeCompras]) : 0}">0</th>
                    <th scope="col" class="text-end" th:text="${#lists.size(relatorio) > 0 ? #numbers.formatCurrency(#aggregates.sum(relatorio.![lucroAtual])) : 'R$ 0,00'}">R$ 0,00</th>
                    <th scope="col" class="text-end" th:text="${#lists.size(relatorio) > 0 ? #numbers.formatCurrency(#aggregates.sum(relatorio.![lucroPassado])) : 'R$ 0,00'}">R$ 0,00</th>
                    <th scope="col" class="text-center" colspan="3">
                        <small class="text-muted">
                            Período: <span th:text="${anoInicial} + ' - ' + ${anoFinal}">2024 - 2024</span> |
                            Meses: <span th:text="${#lists.size(meses)}">12</span>
                        </small>
                    </th>
                </tr>
            </tfoot>
        </table>
    </div>

    <div th:if="${#lists.isEmpty(relatorio)}" class="text-center py-4">
        <i class="bi bi-inbox display-4 text-muted"></i>
        <p class="text-muted mt-2">Nenhum dado encontrado para o período selecionado.</p>
    </div>
</body>
</html>
