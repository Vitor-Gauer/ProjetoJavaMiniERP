<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erro no Relatório - ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-danger">
                <div class="card-header bg-danger text-white fw-bold">
                    <i class="bi bi-exclamation-triangle me-2"></i>Erro no Relatório
                </div>
                <div class="card-body">
                    <div class="text-center mb-4">
                        <i class="bi bi-file-earmark-x text-danger" style="font-size: 4rem;"></i>
                    </div>
                    
                    <div class="alert alert-danger" th:if="${erro}" th:text="${erro}">
                        Ocorreu um erro ao gerar o relatório.
                    </div>
                    
                    <div class="alert alert-warning" th:unless="${erro}">
                        Ocorreu um erro ao gerar o relatório. Por favor, tente novamente.
                    </div>
                    
                    <div class="d-grid gap-2">
                        <a href="/relatorio/lucro" class="btn btn-primary">
                            <i class="bi bi-arrow-left me-1"></i> Voltar ao Relatório
                        </a>
                        <a href="/dashboard" class="btn btn-secondary">
                            <i class="bi bi-house me-1"></i> Ir para o Dashboard
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
