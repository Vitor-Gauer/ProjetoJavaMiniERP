<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        /* Ajuste para as linhas de input ficarem parecidas com o rascunho */
        .input-line {
            border: none;
            border-bottom: 2px solid #000;
            border-radius: 0;
            padding-left: 5px;
        }
        .input-line:focus {
            box-shadow: none;
            border-bottom-color: #555;
        }
    </style>
</head>
<body class="bg-secondary d-flex align-items-center justify-content-center min-vh-100">

<div class="card shadow-lg " style="width: 100%; max-width: 80%; border-radius: 0; border: 2px solid black; padding-right: 0;">
    <div class="row g-0 align-items-center bg-secondary" style="min-height: 450px;">

        <div class="col-md-4 p-4">
            <div class="bg-dark text-white d-flex align-items-center justify-content-center rounded-4" style="height: 400px;">
                <h4 class="m-0">Logo nosso</h4>
            </div>
        </div>

        <div class="col-md-8 p-5" style="padding-right: 0px;">
            <h2 class="text-center mb-5" style="font-size: 2.5rem;">Login</h2>
            <form>
                <div class="mb-4 d-flex align-items-end">
                    <label class="form-label mb-0 me-2 h4">Empresa:</label>
                    <input type="text" class="form-control input-line">
                </div>

                <div class="mb-5 d-flex align-items-end">
                    <label class="form-label mb-0 me-4 h4">Senha:</label>
                    <input type="password" class="form-control input-line">
                </div>
                <div class="row text-end mt-5 align-content-evenly" style="max-width: 90%;">
                    <div class="col align-self-evenly text-end">
                        <button type="button" class="btn btn-outline-success text-decoration-none fw-normal" style="font-size: 2rem; border-color: lightgreen; color: lightgreen; gap: 0px;">
                            Logar
                        </button>
                    </div>

                    <div class="col align-self-evenly text-end">
                        <button type="button" class="btn btn-outline-warning text-decoration-none fw-normal" style="font-size: 2rem;">
                            Cadastrar
                        </button>
                    </div>
                </div>
            </form>
        </div>

    </div>
</div>

</body>
</html>
