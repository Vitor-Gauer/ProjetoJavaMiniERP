<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login de Usuário - ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark d-flex justify-content-center align-items-center min-vh-100">

<div class="card shadow-sm border-0" style="width: 100%; max-width: 400px; border-radius: 12px;">
    <div class="card-body p-5 text-center bg-white rounded">

        <div class="mb-4 d-flex justify-content-center">
            <div class="p-3 bg-dark text-white rounded shadow-sm w-75">
                <h5 class="m-0">Logo Nosso</h5>
                <small>(Sistema ERP)</small>
            </div>
        </div>

        <h4 class="mb-4 text-secondary">Acesso de Funcionário</h4>

        <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

        <form th:action="@{/login/usuario}" th:object="${loginDto}" method="post">
            <div class="mb-3 text-start">
                <label for="usuario" class="form-label fw-bold text-dark">Usuário:</label>
                <input type="text" id="usuario" class="form-control bg-light" placeholder="Digite seu nome de usuário" th:field="*{login}">
            </div>

            <div class="mb-4 text-start">
                <label for="senha" class="form-label fw-bold text-dark">Senha:</label>
                <input type="password" id="senha" class="form-control bg-light" placeholder="Sua senha de acesso" th:field="*{senha}">
            </div>

            <div class="d-grid gap-3 mb-4">
                <button type="submit" class="btn btn-primary fw-bold py-2">Login</button>
            </div>
        </form>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
