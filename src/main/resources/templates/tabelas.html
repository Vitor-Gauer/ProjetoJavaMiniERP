<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela - ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="p-2 bg-secondary text-white rounded text-center" style="width: 120px;">
            Logo<br><small>(Empresa)</small>
        </div>
        <h2 class="h3">Tabela de Entidades / Transações</h2>
        <button class="btn btn-danger" title="Salva automaticamente ao sair">Sair</button>
    </div>
    <div class="mb-3">
        <span class="fw-bold me-2">Status:</span>
        <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="status" id="todos" checked>
            <label class="form-check-label" for="todos">Todos</label>
    </div>
    <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="status" id="ativos">
        <label class="form-check-label" for="ativos">Ativos</label>
    </div>
        <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="status" id="inativos">
            <label class="form-check-label" for="inativos">Inativos</label>
        </div>
    </div>

    <div class="d-flex gap-2 mb-4">
        <button class="btn btn-success">Adicionar</button>
        <button class="btn btn-info text-white">Atualizar</button>
        <button class="btn btn-warning text-white">Alterar</button>
        <button class="btn btn-secondary">Filtrar</button>
        <button class="btn btn-dark">Relatório</button> <!-- relatorio somente se for transacao -->
    </div>
    <div class="table-responsive bg-white rounded shadow-sm mt-2 p-3">
        <table class="table table-hover">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Descrição</th>
                <th>Status</th>
                <th>Ações</th>
            </tr>
            </thead>
            <tbody>
            <tr>
                <td>1</td>
                <td>Exemplo de Dado</td>
                <td><span class="badge bg-success">Ativo</span></td>
                <td>...</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
