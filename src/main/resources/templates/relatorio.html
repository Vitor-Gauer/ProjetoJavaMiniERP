<div th:fragment="modalRelatorio">
    <div class="modal fade" id="modalRelatorio" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Relatório</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="formRelatorio" method="get" action="/relatorio/pdf">
                        <div class="mb-3">
                            <label for="tipo" class="form-label">Tipo</label>
                            <input class="form-control" name="tipo" th:value="${tipo}" readonly id="tipo">
                        </div>

                        <div class="mb-3">
                            <label for="status" class="form-label">Status</label>
                            <select class="form-select" name="status" id="status">
                                <option value="todos">Todos</option>
                                <option value="ativos">Ativos</option>
                                <option value="inativos">Inativos</option>
                                <option value="quitados">Quitados</option>
                                <option value="devendo">Devendo</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="dataInicio" class="form-label">Período</label>
                            <div class="row g-2">
                                <div class="col-6">
                                    <input class="form-control" type="date" name="dataInicio" id="dataInicio">
                                </div>
                                <div class="col-6">
                                    <input class="form-control" type="date" name="dataFim" id="dataFim">
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="campoData" class="form-label">Campo de data</label>
                            <select class="form-select" name="campoData" id="campoData">
                                <option value="auto" selected>Automático (criação se pendente / resolução se quitado)</option>
                                <option value="criacao">Criação</option>
                                <option value="resolucao">Resolução</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" form="formRelatorio" class="btn btn-dark">Gerar PDF</button>
                </div>
            </div>
        </div>
    </div>
</div>
