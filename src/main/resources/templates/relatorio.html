<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Relatório - ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.1;
            font-size: 3rem;
            text-align: center;
            z-index: 0;
            pointer-events: none;
        }
        .form-content { position: relative; z-index: 1; }
    </style>
</head>
<body class="bg-light position-relative min-vh-100 d-flex align-items-center">

<div class="watermark fw-bold">
    Logo<br>(da empresa que esta usando)
</div>

<div class="container form-content">
    <div class="card shadow-sm mx-auto" style="max-width: 600px;">
        <div class="card-header bg-dark text-white text-center">
            <h3 class="h5 m-0">Customizados form</h3>
        </div>
        <div class="card-body">
            <form>
                <div class="mb-3">
                    <label class="form-label fw-bold">Relatório:</label>
                    <select class="form-select">
                        <option>Financeiro</option>
                        <option>Estoque</option>
                        <option>...</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Data de Criação:</label>
                    <input type="datetime-local" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Nome:</label>
                    <input type="text" class="form-control" placeholder="(preencha)">
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold">Autor:</label>
                    <input type="text" class="form-control" value="alguem">
                </div>
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary">Gerar Relatório</button>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
